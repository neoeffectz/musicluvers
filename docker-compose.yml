services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: soundmatch
      POSTGRES_USER: soundmatch
      POSTGRES_PASSWORD: soundmatch
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://soundmatch:soundmatch@db:5432/soundmatch
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://soundmatch:soundmatch@db:5432/soundmatch
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://soundmatch:soundmatch@db:5432/soundmatch
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  staticfiles:
