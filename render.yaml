# Render Blueprint for Music Luvers (SoundMatch).
# In Render: New + -> Blueprint -> pick this repo. Render asks once for each value marked `sync: false`
# (copy them from your local .env).
#
# Free plan: there is no separate worker service. RUN_WORKER_IN_WEB=1 makes the web service also run the
# background jobs (match scores, notifications, emails, city lookups) — see docker-entrypoint.sh.
# On a paid plan you can move them to their own "type: worker" service with
# dockerCommand: celery -A config worker -B -l info --concurrency 2  (and set RUN_WORKER_IN_WEB to "0").
#
# Region: virginia sits next to Neon's us-east-1 database, so each database query takes ~1-2 ms instead
# of ~340 ms. (If you later move the database to Europe, create new services in frankfurt to match —
# a service's region can't be changed after creation.)

envVarGroups:
  - name: musicluvers-config        # non-secret settings shared by both services
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: VAPID_SUBJECT
        value: mailto:hello@musicluvers.site
      - key: DEFAULT_FROM_EMAIL
        value: Music Luvers <hello@musicluvers.site>
      - key: RESEND_DOMAIN_VERIFIED
        value: "False"              # set to True once musicluvers.site shows Verified in Resend
      - key: POSTHOG_KEY            # visitor analytics; this key is public by design
        value: phc_r3xLooqy4Yd9WtLCvYnJdK8s3ViSmxjEN8QbqanMG6Sh
      - key: POSTHOG_HOST           # change to https://eu.i.posthog.com if your PostHog is on EU
        value: https://us.i.posthog.com
      - key: POSTHOG_IGNORE_USER_IDS  # your own account(s), never tracked; comma-separated
        value: fffe2c62-4000-4c86-95a4-7eb1d407a835
      - key: DJANGO_SECRET_KEY      # generated once by Render, shared by web + worker
        generateValue: true

services:
  # Website + live updates (Daphne) + background jobs. On start it runs migrations and collectstatic.
  - type: web
    name: musicluvers-web
    plan: free
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - fromGroup: musicluvers-config
      - key: PORT
        value: "10000"
      - key: RUN_WORKER_IN_WEB      # free plan: run background jobs inside the web service
        value: "1"
      - key: DATABASE_URL           # Neon connection string
        sync: false
      - key: REDIS_URL              # Upstash rediss:// URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID      # artist/song search only
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: FERNET_KEY             # must be the SAME value as your local .env (it decrypts stored data)
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY        # the Lounge's shared player (full songs, in sync)
        sync: false
      - key: VAPID_PUBLIC_KEY       # must be the SAME as local, or everyone has to re-enable notifications
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
