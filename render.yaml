# Render Blueprint for Music Luvers (SoundMatch).
# In Render: New + -> Blueprint -> pick this repo. Render creates both services and asks once for each
# value marked `sync: false` (copy them from your local .env). The worker copies those values from the web
# service, so you only type each one once.
#
# Region: virginia sits next to Neon's us-east-1 database, so each database query takes ~1-2 ms instead
# of ~340 ms. (If you later move the database to Europe, create new services in frankfurt to match —
# a service's region can't be changed after creation.)

envVarGroups:
  - name: musicluvers-config        # non-secret settings shared by both services
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: VAPID_SUBJECT
        value: mailto:hello@musicluvers.site
      - key: DEFAULT_FROM_EMAIL
        value: Music Luvers <hello@musicluvers.site>
      - key: RESEND_DOMAIN_VERIFIED
        value: "False"              # set to True once musicluvers.site shows Verified in Resend
      - key: DJANGO_SECRET_KEY      # generated once by Render, shared by web + worker
        generateValue: true

services:
  # Website + live updates (Daphne). On start it runs migrations and collectstatic (docker-entrypoint.sh).
  - type: web
    name: musicluvers-web
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - fromGroup: musicluvers-config
      - key: PORT
        value: "10000"
      - key: DATABASE_URL           # Neon connection string
        sync: false
      - key: REDIS_URL              # Upstash rediss:// URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID      # artist/song search only
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: FERNET_KEY             # must be the SAME value as your local .env (it decrypts stored data)
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY       # must be the SAME as local, or everyone has to re-enable notifications
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  # Background jobs: match scores, notifications, push, emails, city lookups; -B also runs the scheduler.
  - type: worker
    name: musicluvers-worker
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker -B -l info --concurrency 2
    autoDeploy: true
    envVars:
      - fromGroup: musicluvers-config
      - key: DATABASE_URL
        fromService: { type: web, name: musicluvers-web, envVarKey: DATABASE_URL }
      - key: REDIS_URL
        fromService: { type: web, name: musicluvers-web, envVarKey: REDIS_URL }
      - key: CLOUDINARY_CLOUD_NAME
        fromService: { type: web, name: musicluvers-web, envVarKey: CLOUDINARY_CLOUD_NAME }
      - key: CLOUDINARY_API_KEY
        fromService: { type: web, name: musicluvers-web, envVarKey: CLOUDINARY_API_KEY }
      - key: CLOUDINARY_API_SECRET
        fromService: { type: web, name: musicluvers-web, envVarKey: CLOUDINARY_API_SECRET }
      - key: SPOTIFY_CLIENT_ID
        fromService: { type: web, name: musicluvers-web, envVarKey: SPOTIFY_CLIENT_ID }
      - key: SPOTIFY_CLIENT_SECRET
        fromService: { type: web, name: musicluvers-web, envVarKey: SPOTIFY_CLIENT_SECRET }
      - key: FERNET_KEY
        fromService: { type: web, name: musicluvers-web, envVarKey: FERNET_KEY }
      - key: LASTFM_API_KEY
        fromService: { type: web, name: musicluvers-web, envVarKey: LASTFM_API_KEY }
      - key: VAPID_PUBLIC_KEY
        fromService: { type: web, name: musicluvers-web, envVarKey: VAPID_PUBLIC_KEY }
      - key: VAPID_PRIVATE_KEY
        fromService: { type: web, name: musicluvers-web, envVarKey: VAPID_PRIVATE_KEY }
