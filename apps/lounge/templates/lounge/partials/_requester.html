{% if req.user_id == request.user.id %}
  <div class="lounge-requester"><span class="lounge-muted">{{ label }}</span> <strong>you</strong></div>
{% else %}
  <a href="#" class="lounge-requester" data-person="{{ req.user_id }}">
    <img src="{{ req.user.photo_url|default:'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80' }}" alt="">
    <span><span class="lounge-muted">{{ label }}</span> <strong>{{ req.user.first_name|default:"Someone" }}{% if req.user.age %}, {{ req.user.age }}{% endif %}</strong></span>
    <span class="lounge-view">View <i class="fa-solid fa-chevron-right"></i></span>
  </a>
{% endif %}
