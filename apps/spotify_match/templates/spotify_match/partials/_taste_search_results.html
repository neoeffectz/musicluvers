{% if error %}<p class="taste-error">{{ error }}</p>{% endif %}
{% for artist in results %}
  <div class="taste-result">
    {% if artist.image_url %}<img src="{{ artist.image_url }}" alt="">{% else %}<div class="no-img"></div>{% endif %}
    <span>{{ artist.name }}</span>
    {% if artist.external_id in picked %}
      <button type="button" class="taste-add-btn" data-id="{{ artist.external_id }}" disabled>Added</button>
    {% else %}
      <button type="button" class="taste-add-btn" data-id="{{ artist.external_id }}"
              hx-post="{% url 'spotify_match:taste_add' %}" hx-vals='{"artist_id": "{{ artist.external_id|escapejs }}"}'
              hx-target="#taste-picks">Add</button>
    {% endif %}
  </div>
{% endfor %}
