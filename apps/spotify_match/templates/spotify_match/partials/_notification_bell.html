{% load notif_tags %}
<button type="button" class="notif-bell" id="notif-bell" onclick="toggleNotifications()" aria-label="Notifications" aria-haspopup="true">
  <i class="fa-regular fa-bell"></i>
  <span class="notif-badge-slot" hx-get="{% url 'spotify_match:notifications_badge' %}" hx-trigger="notificationsChanged from:body, refreshNotifs from:body" hx-swap="innerHTML">{% unread_notifications as unread %}{% include "spotify_match/partials/_notification_badge.html" %}</span>
</button>
