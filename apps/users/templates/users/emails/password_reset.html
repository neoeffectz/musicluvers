<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#222;">
  <h2 style="color:#f3582c;margin:0 0 16px;">Music Luvers</h2>
  <p>Hi {{ user.first_name|default:"there" }},</p>
  <p>Someone (hopefully you) asked to reset your Music Luvers password.</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#f3582c;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:bold;">Choose a new password</a></p>
  <p style="color:#777;font-size:13px;">The link works for 2 hours. If you didn't ask for this, ignore this email and your password stays the same.</p>
</div>
