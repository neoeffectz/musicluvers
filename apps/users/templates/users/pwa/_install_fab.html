{% load static %}
{# Floating "Install app" button on the home page. Hidden when already running as the installed app. #}
<button type="button" class="install-fab" id="install-fab" hidden aria-haspopup="dialog">
  <span class="install-fab-icon"><img src="{% static 'icons/icon-192.png' %}" alt=""></span>
  <span class="install-fab-text"><strong>Install the app</strong><small>Free · works like a real app</small></span>
  <i class="fa-solid fa-download"></i>
</button>

<div class="install-sheet" id="install-sheet" hidden role="dialog" aria-label="Install Music Luvers">
  <div class="install-sheet-backdrop" data-close></div>
  <div class="install-sheet-panel">
    <img src="{% static 'icons/icon-192.png' %}" alt="" class="install-sheet-logo">
    <h3>Install Music Luvers</h3>
    <div id="install-steps"></div>
    <button type="button" class="install-sheet-close" data-close>Got it</button>
  </div>
</div>

<style>
  .install-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(20,20,24,0.92); backdrop-filter: blur(10px); color: #fff; font-family: inherit; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 4px rgba(243,88,44,0.18); animation: fabBob 2.8s ease-in-out infinite; }
  .install-fab[hidden] { display: none; }
  .install-fab:hover { animation-play-state: paused; }
  .install-fab-icon img { width: 40px; height: 40px; border-radius: 11px; display: block; }
  .install-fab-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
  .install-fab-text strong { font-size: 14px; }
  .install-fab-text small { font-size: 11px; color: rgba(255,255,255,0.6); }
  .install-fab > i { color: #f3582c; font-size: 16px; margin-left: 2px; }
  @keyframes fabBob { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-6px) rotate(-1.5deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-3px) rotate(1deg); } }
  @media (prefers-reduced-motion: reduce) { .install-fab { animation: none; } }
  .install-sheet { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: flex-end; justify-content: center; }
  .install-sheet[hidden] { display: none; }
  .install-sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
  .install-sheet-panel { position: relative; width: 100%; max-width: 440px; background: #1b1d23; border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; color: #fff; }
  @media (min-width: 700px) { .install-sheet { align-items: center; } .install-sheet-panel { border-radius: 22px; } }
  .install-sheet-logo { width: 64px; height: 64px; border-radius: 16px; }
  .install-sheet-panel h3 { margin: 10px 0 12px; font-size: 19px; }
  .install-sheet-panel ol { text-align: left; margin: 0 0 16px; padding-left: 22px; line-height: 1.9; color: #e5e5ea; font-size: 15px; }
  .install-sheet-panel p { color: #c7c7cc; font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
  .install-sheet-panel code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 6px; font-size: 13px; word-break: break-all; }
  .install-sheet-close { width: 100%; padding: 13px; border: none; border-radius: 14px; background: linear-gradient(135deg, #e02f26, #f3582c); color: #fff; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .site-footer { padding-bottom: 96px !important; } /* room so the button never covers the footer links */
</style>

<script>
(() => {
  const fab = document.getElementById('install-fab');
  const sheet = document.getElementById('install-sheet');
  const steps = document.getElementById('install-steps');
  const ua = navigator.userAgent;
  const iosOtherBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);

  function start() {
    if (typeof window.mlCanInstall !== 'function') { setTimeout(start, 150); return; }
    if (window.mlIsStandalone) return;          // already the installed app
    fab.hidden = false;
  }
  function open(html) { steps.innerHTML = html; sheet.hidden = false; }

  fab.addEventListener('click', async () => {
    if (!window.mlIsIOS && window.mlCanInstall()) {   // Android / desktop Chrome & Edge: real install prompt
      const outcome = await window.mlInstall();
      if (outcome === 'accepted') { fab.hidden = true; return; }
      if (outcome === 'dismissed') return;
      // 'unavailable': fall through to the manual steps
    }
    if (window.mlIsIOS && iosOtherBrowser) {
      open(`<p>On iPhone, apps can only be added from <b>Safari</b>. Copy this link and open it in Safari:</p><p><code>${location.origin}</code></p>`);
    } else if (window.mlIsIOS) {
      open(`<ol><li>Tap the <b>Share</b> button <i class="fa-solid fa-arrow-up-from-bracket"></i> at the bottom of Safari</li>
        <li>Scroll and tap <b>Add to Home Screen</b> <i class="fa-regular fa-square-plus"></i></li>
        <li>Tap <b>Add</b>, then open Music Luvers from your Home Screen</li></ol>`);
    } else if (/Android/.test(ua)) {
      open(`<ol><li>Tap the <b>⋮</b> menu in Chrome (top right)</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b></li>
        <li>Open Music Luvers from your Home Screen</li></ol>`);
    } else {
      open(`<p>Music Luvers is made for your phone. Open this link on your phone and tap <b>Install the app</b>:</p><p><code>${location.origin}</code></p>`);
    }
  });
  sheet.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => { sheet.hidden = true; }));
  document.addEventListener('ml-can-install', () => { if (!window.mlIsStandalone) fab.hidden = false; });
  window.addEventListener('appinstalled', () => { fab.hidden = true; });
  start();
})();
</script>
