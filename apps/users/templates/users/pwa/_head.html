{% load static %}
<link rel="manifest" href="{% url 'users:manifest' %}">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Luvers">
<style>
  /* Phones zoom the page when you tap a box with text under 16px. Keep every typing box at 16px on touch screens. */
  @media (pointer: coarse) {
    input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=hidden]), textarea, select { font-size: 16px !important; }
  }
</style>
<link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
{% if push_enabled %}<meta name="ml-vapid-key" content="{{ vapid_public_key }}">{% endif %}
{% if user.is_authenticated %}<meta name="ml-signed-in" content="1">{% endif %}
<script src="{% static 'js/pwa.js' %}?v=20261114g" defer></script>
{% include "users/partials/_analytics.html" %}
<script src="{% static 'js/loading.js' %}?v=20261114h" defer></script>
<script src="{% static 'js/errors.js' %}?v=20261115b" defer></script>
